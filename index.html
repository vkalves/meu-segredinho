<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para onde vai?</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,0.08), transparent 28%),
        radial-gradient(circle at 80% 80%, rgba(255,255,255,0.05), transparent 30%),
        #050505;

      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* Luz que acompanha o mouse */
    .mouse-light {
      position: fixed;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      pointer-events: none;

      background: radial-gradient(
        circle,
        rgba(255, 255, 255, 0.07) 0%,
        rgba(255, 255, 255, 0.025) 35%,
        transparent 70%
      );

      transform: translate(-50%, -50%);
      filter: blur(10px);
      transition: left 0.15s ease-out, top 0.15s ease-out;
    }

    /* Luzes decorativas */
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.13;
      animation: flutuar 10s ease-in-out infinite alternate;
    }

    .orb-1 {
      width: 330px;
      height: 330px;
      background: #ffffff;
      top: -130px;
      left: -100px;
    }

    .orb-2 {
      width: 400px;
      height: 400px;
      background: #777777;
      right: -160px;
      bottom: -160px;
      animation-delay: -4s;
    }

    .conteudo {
      position: relative;
      z-index: 10;
      text-align: center;
      animation: aparecer 1.3s cubic-bezier(.16,1,.3,1);
    }

    h1 {
      color: #ffffff;
      font-size: clamp(2.8rem, 8vw, 7rem);
      font-weight: 600;
      letter-spacing: -0.06em;
      line-height: 1;

      text-shadow:
        0 0 25px rgba(255,255,255,0.08),
        0 10px 50px rgba(0,0,0,0.8);

      animation: respirar 4s ease-in-out infinite;
      cursor: default;
      user-select: none;
    }

    @keyframes aparecer {
      from {
        opacity: 0;
        transform: translateY(25px) scale(0.96);
        filter: blur(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: blur(0);
      }
    }

    @keyframes respirar {
      0%,
      100% {
        transform: scale(1);
        opacity: 0.92;
      }

      50% {
        transform: scale(1.025);
        opacity: 1;
      }
    }

    @keyframes flutuar {
      from {
        transform: translate3d(0, 0, 0) scale(1);
      }

      to {
        transform: translate3d(50px, 35px, 0) scale(1.12);
      }
    }

    /* Granulação suave */
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.035;

      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='.8'/%3E%3C/svg%3E");
    }
  </style>
</head>

<body>

  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div class="mouse-light" id="mouseLight"></div>

  <main class="conteudo">
    <h1>para onde vai?</h1>
  </main>

  <script>
    const light = document.getElementById("mouseLight");

    document.addEventListener("mousemove", (event) => {
      light.style.left = event.clientX + "px";
      light.style.top = event.clientY + "px";
    });
  </script>

</body>
</html>
