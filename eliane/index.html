<style>
@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

@keyframes popIn {
  from {
    opacity: 0;
    transform: translateY(10px) scale(.97);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

@keyframes iconPulse {
  0%, 100% {
    transform: scale(1);
    box-shadow: 0 0 0 0 rgba(0,136,204,.18);
  }
  50% {
    transform: scale(1.04);
    box-shadow: 0 0 0 10px rgba(0,136,204,0);
  }
}

@keyframes arrowMove {
  0%, 100% {
    transform: translateX(0);
    opacity: .45;
  }
  50% {
    transform: translateX(5px);
    opacity: 1;
  }
}

.overlay {
  position: fixed;
  inset: 0;
  background: rgba(12,20,18,.24);

  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);

  display: flex;
  align-items: center;
  justify-content: center;

  z-index: 9999;
  padding: 20px;

  animation: fadeIn .22s ease-out;
}

.overlay.is-closing {
  opacity: 0;
  transition: opacity .18s ease;
}

.popup {
  width: 100%;
  max-width: 350px;

  background: rgba(255,255,255,.97);
  border: 1px solid rgba(17,17,17,.06);

  border-radius: 24px;
  padding: 22px 20px 18px;

  text-align: center;

  box-shadow: 0 22px 60px rgba(18,24,27,.20);

  animation: popIn .32s cubic-bezier(.2,.8,.2,1);
}

.popup-icon {
  width: 52px;
  height: 52px;

  margin: 0 auto 13px;

  border-radius: 16px;

  display: grid;
  place-items: center;

  background: rgba(0,136,204,.10);
  color: #0088CC;

  animation: iconPulse 2.4s ease-in-out infinite;
}

.popup-icon svg {
  width: 27px;
  height: 27px;
}

.popup-kicker {
  display: inline-flex;
  align-items: center;

  margin-bottom: 7px;

  padding: 5px 9px;

  border-radius: 999px;

  background: #f3f7f9;

  color: #5d6870;

  font-size: 11px;
  font-weight: 800;

  letter-spacing: .03em;
  text-transform: uppercase;
}

.popup-title {
  margin: 0 0 8px;

  font-size: 22px;
  line-height: 1.15;

  font-weight: 850;

  color: #111;
}

.popup-text {
  max-width: 285px;

  margin: 0 auto 16px;

  font-size: 14px;
  line-height: 1.45;

  color: #596168;

  font-weight: 550;
}

.popup-flow {
  display: flex;
  align-items: center;
  justify-content: center;

  gap: 10px;

  margin-bottom: 17px;

  color: #778087;

  font-size: 12px;
  font-weight: 750;
}

.flow-item {
  display: flex;
  align-items: center;

  gap: 6px;
}

.flow-icon {
  width: 27px;
  height: 27px;

  border-radius: 9px;

  display: grid;
  place-items: center;

  background: #f3f5f6;

  color: #555f66;
}

.flow-icon svg {
  width: 15px;
  height: 15px;
}

.flow-arrow {
  color: #0088CC;

  font-size: 18px;

  animation: arrowMove 1.4s ease-in-out infinite;
}

.popup-btn {
  width: 100%;
  min-height: 48px;

  border: none;
  border-radius: 999px;

  padding: 13px 16px;

  background: #0088CC;

  color: white;

  font-size: 15px;
  font-weight: 800;

  cursor: pointer;

  box-shadow: 0 8px 20px rgba(0,136,204,.20);

  transition: transform .15s ease;
}

.popup-btn:active {
  transform: scale(.985);
}

.popup-note {
  margin: 9px 0 0;

  color: #9aa1a6;

  font-size: 11px;
  font-weight: 600;
}

.tutorial-img {
  opacity: 1;

  transition: opacity .35s ease-in-out;
}

.tutorial-img.is-fading {
  opacity: 0;
}

@media (prefers-reduced-motion: reduce) {
  .popup,
  .popup-icon,
  .flow-arrow {
    animation: none;
  }
}
</style>


<div class="overlay" id="popup">

  <div
    class="popup"
    role="dialog"
    aria-modal="true"
    aria-labelledby="popupTitulo"
  >

    <div class="popup-icon">

      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M12 3a9 9 0 1 0 9 9"/>
        <path d="M12 3v9h9"/>
        <path
          d="M8.5 8.5h.01M8.5 12h.01M8.5 15.5h.01"
          stroke-width="3"
        />
      </svg>

    </div>


    <div class="popup-kicker">
      2 passos rápidos
    </div>


    <h2
      class="popup-title"
      id="popupTitulo"
    >
      Abra no navegador
    </h2>


    <p class="popup-text">
      O TikTok pode bloquear o Telegram.
      Veja como abrir corretamente.
    </p>


    <div class="popup-flow">

      <span class="flow-item">

        <span class="flow-icon">
          <svg
            viewBox="0 0 24 24"
            fill="currentColor"
          >
            <circle cx="5" cy="12" r="2"/>
            <circle cx="12" cy="12" r="2"/>
            <circle cx="19" cy="12" r="2"/>
          </svg>
        </span>

        3 pontinhos

      </span>


      <span class="flow-arrow">
        →
      </span>


      <span class="flow-item">

        <span class="flow-icon">

          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="12" r="9"/>
            <path d="M3 12h18"/>
            <path d="M12 3a15 15 0 0 1 0 18"/>
            <path d="M12 3a15 15 0 0 0 0 18"/>
          </svg>

        </span>

        navegador

      </span>

    </div>


    <button
      class="popup-btn"
      type="button"
      onclick="fecharPopup()"
    >
      Ver tutorial
    </button>


    <p class="popup-note">
      Leva menos de 10 segundos
    </p>

  </div>

</div>


<script>
function fecharPopup() {

  const popup = document.getElementById("popup");

  popup.classList.add("is-closing");

  setTimeout(() => {
    popup.style.display = "none";
  }, 180);

}


/* TROCA DAS IMAGENS DO TUTORIAL */

const tutorialImagem =
  document.getElementById("tutorialImagem");

let tutorialIndice = 0;


/*
Mantenha aqui o array tutorialImagens
que já existe no seu HTML.
*/


tutorialImagem.src =
  tutorialImagens[0];


setInterval(() => {

  tutorialImagem.classList.add("is-fading");


  setTimeout(() => {

    tutorialIndice =
      (tutorialIndice + 1) %
      tutorialImagens.length;


    tutorialImagem.src =
      tutorialImagens[tutorialIndice];


    tutorialImagem.classList.remove(
      "is-fading"
    );

  }, 350);


}, 4500);
</script>
