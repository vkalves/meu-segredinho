<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@1,500;1,600&display=swap');

:root {
    --privacy-grad-start: #2AABEE;
    --privacy-grad-end:   #229ED9;
    --privacy-accent:     #2AABEE;
    --privacy-text:       #343434;
    --bg-grad-start: #eaf6fd;
    --bg-grad-end:   #fcfcfc;
    --card-bg:       #ffffff;
    --badge-bg:      #e8edf1;
    --badge-text:    #4a4a4a;
    --subtitle-text: #555555;
    --secure-text:   #888888;
    --icon-stroke:   #777777;
}

body.dark-mode {
    --bg-grad-start: #0f1115;
    --bg-grad-end:   #15181e;
    --card-bg:       #1b1e24;
    --badge-bg:      #2a2e36;
    --badge-text:    #e4e6eb;
    --privacy-text:  #f2f2f2;
    --subtitle-text: #b7bcc4;
    --secure-text:   #8a8f98;
    --icon-stroke:   #a2a7b0;
}

html, body { margin: 0; padding: 0; width: 100%; height: 100%; }
html { height: -webkit-fill-available; }
* { box-sizing: border-box; font-family: 'Montserrat', sans-serif; }

body {
    min-height: 100vh;
    min-height: -webkit-fill-available;
    min-height: 100dvh;
    background: linear-gradient(135deg, var(--bg-grad-start), var(--bg-grad-end));
    display: flex; align-items: center; justify-content: center; padding: 20px;
    transition: background 0.3s ease;
}

.card {
    background: var(--card-bg); width: 100%; max-width: 410px; min-height: 515px;
    padding: 40px 30px; border-radius: 25px; text-align: center;
    box-shadow: 0 20px 40px rgba(0,0,0,0.1);
    display: flex; flex-direction: column; align-items: center;
    transition: background 0.3s ease;
    position: relative;
}

/* ── Avatar Ring ── */
.avatar-ring {
    width: 136px; height: 136px; border-radius: 50%;
    margin-bottom: 16px;
    position: relative;
    cursor: pointer;
    background: transparent;
    padding: 0;
}

.avatar {
    width: 126px; height: 126px; border-radius: 50%;
    object-fit: cover; display: block;
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    border: 2px solid #fff;
    transition: transform 0.3s ease, opacity 0.6s ease, filter 0.35s ease;
    /* Bloqueia o menu nativo de "salvar imagem" no toque longo */
    pointer-events: none;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    -webkit-user-drag: none;
    -khtml-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
    /* previne qualquer salto de layout durante transições, mesmo com pinch-zoom */
    will-change: opacity;
    backface-visibility: hidden;
}

.avatar-ring:active .avatar {
    transform: translate(-50%, -50%) scale(0.96);
}

/* Segunda foto do avatar — entra por cima da primeira via crossfade */
.avatar-secondary {
    opacity: 0;
}

/* Desfoque da foto por trás da notificação */
.avatar.avatar-blurred {
    filter: blur(3px);
}

.story-ring-svg {
    position: absolute;
    inset: 0;
    width: 136px;
    height: 136px;
    pointer-events: none;
    overflow: visible;
}

.story-ring-track {
    fill: none;
    stroke: transparent;
    stroke-width: 3.5;
}

/* Anel azul segmentado. A máscara revela os segmentos sem mover o anel. */
.story-ring-arc {
    fill: none;
    stroke: var(--privacy-grad-start);
    stroke-width: 3.7;
    stroke-linecap: round;
    stroke-dasharray: 6 5;
    stroke-dashoffset: 0;
    transform-origin: 68px 68px;
    transform: rotate(-90deg);
    opacity: 1;
}

.story-ring-solid {
    fill: none;
    stroke: var(--privacy-grad-start);
    stroke-width: 3.7;
    stroke-linecap: round;
    stroke-dasharray: none;
    stroke-dashoffset: 0;
    transform-origin: 68px 68px;
    transform: rotate(-90deg);
    opacity: 0;
}

@keyframes ringBlink {
    0%, 100% { opacity: 1; }
    50%      { opacity: 0.15; }
}

.story-ring-solid.ring-blink {
    animation: ringBlink 0.25s ease-in-out 2;
}

.story-ring-reveal {
    fill: none;
    stroke: #fff;
    stroke-width: 7;
    stroke-linecap: round;
    stroke-dasharray: 402.1 402.1;
    stroke-dashoffset: 402.1;
    transform-origin: 68px 68px;
    transform: rotate(-90deg);
}

/* Sem pulso, brilho ou escala ao completar. */
/* ── Lightbox ── */
.avatar-lightbox {
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.4s ease;
    background: rgba(0,0,0,0);
    backdrop-filter: blur(0px);
    -webkit-backdrop-filter: blur(0px);
    transition: opacity 0.4s ease, background 0.4s ease, backdrop-filter 0.4s ease;
}

.avatar-lightbox.open {
    opacity: 1;
    pointer-events: all;
    background: rgba(0,0,0,0.75);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
}

.lightbox-inner {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    transform: scale(0.7) translateY(30px);
    opacity: 0;
    transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.35s ease;
}

.avatar-lightbox.open .lightbox-inner {
    transform: scale(1) translateY(0);
    opacity: 1;
}

.avatar-lightbox-img {
    width: 82vw;
    max-width: 330px;
    height: 82vw;
    max-height: 330px;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid rgba(255,255,255,0.9);
    box-shadow:
        0 0 0 1px rgba(42,171,238,0.3),
        0 20px 60px rgba(0,0,0,0.6),
        0 0 80px rgba(42,171,238,0.2);
    display: block;
    pointer-events: none;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    -webkit-user-drag: none;
    user-select: none;
}

/* Anel azul ao redor da foto expandida */
.lightbox-ring {
    position: absolute;
    inset: -8px;
    border-radius: 50%;
    border: 2.5px solid rgba(42,171,238,0.6);
    transform: scale(0.85);
    opacity: 0;
    transition: transform 0.5s cubic-bezier(0.34, 1.2, 0.64, 1) 0.1s, opacity 0.4s ease 0.1s;
}

.avatar-lightbox.open .lightbox-ring {
    transform: scale(1);
    opacity: 1;
}

/* Shimmer externo que aparece ao abrir */
.lightbox-shimmer {
    position: absolute;
    inset: -20px;
    border-radius: 50%;
    border: 1px solid rgba(42,171,238,0.25);
    transform: scale(0.8);
    opacity: 0;
    transition: transform 0.7s cubic-bezier(0.2, 1, 0.4, 1) 0.15s, opacity 0.5s ease 0.15s;
}

.avatar-lightbox.open .lightbox-shimmer {
    transform: scale(1);
    opacity: 1;
}


/* ── Resto do layout ── */
.badge {
    font-family: 'Montserrat', sans-serif;
    font-style: normal;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.5px;
    text-transform: none;
    color: var(--badge-text);
    background: var(--badge-bg);
    padding: 6px 16px;
    border-radius: 50px;
    margin: 0 auto 11px;
    width: fit-content;
    align-self: center;
    line-height: 16px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    transition: background 0.3s ease, color 0.3s ease;
}

.badge-name {
    display: inline-flex; align-items: center; gap: 5px;
    justify-content: center;
    line-height: 16px;
    white-space: nowrap;
    text-transform: none !important;
    font-variant: normal;
}

.badge-name #profile-name {
    display: block;
    line-height: 16px;
}

.verified-icon {
    width: 16px;
    height: 16px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transform-origin: center;
}

.verified-icon svg {
    width: 16px;
    height: 16px;
    display: block;
    overflow: visible;
}

.verified-icon.pulse {
    animation: verified-pulse 850ms cubic-bezier(0.22, 1, 0.36, 1) 1;
}

@keyframes verified-pulse {
    0%   { transform: scale(1); }
    35%  { transform: scale(1.18); }
    58%  { transform: scale(0.96); }
    78%  { transform: scale(1.08); }
    100% { transform: scale(1); }
}

.title { font-size: 28px; font-weight: 800; color: var(--privacy-text); margin-bottom: 7px; }
.subtitle { font-size: 13px; color: var(--subtitle-text); font-weight: 500; line-height: 1.5; margin-bottom: 17px; }

.online-status {
    --online-glow: 40, 167, 69;
    font-size: 11px; color: #218838; font-weight: 700; margin-bottom: 13px;
    background: #e9fbf0; padding: 4px 10px; border-radius: 20px;
    display: inline-flex; align-items: center; gap: 6px; border: 1px solid #a8dfb8;
    transform-origin: center;
    will-change: opacity;
    animation: online-status-pulse 2.6s ease-in-out infinite;
    transition: background 0.3s ease, color 0.3s ease, border-color 0.3s ease;
}

body.dark-mode .online-status {
    --online-glow: 116, 214, 139;
    color: #74d68b;
    background: rgba(40, 167, 69, 0.15);
    border-color: rgba(116, 214, 139, 0.40);
}

.online-status .dot {
    width: 8px; height: 8px; flex-shrink: 0;
    background-color: #28a745; border-radius: 50%;
    animation: pulse-green 2s ease-out infinite;
}

body.dark-mode .online-status .dot {
    background-color: #74d68b;
}

@keyframes online-status-pulse {
    0%, 100% {
        opacity: 1;
        box-shadow: 0 2px 6px rgba(var(--online-glow), 0.12);
    }
    50% {
        opacity: 0.82;
        box-shadow: 0 2px 6px rgba(var(--online-glow), 0.12);
    }
}

@keyframes pulse-green {
    0%   { box-shadow: 0 0 0 0 rgba(var(--online-glow), 0.35); }
    75%  { box-shadow: 0 0 0 4px rgba(var(--online-glow), 0); }
    100% { box-shadow: 0 0 0 0 rgba(var(--online-glow), 0); }
}

@media (prefers-reduced-motion: reduce) {
    .online-status {
        animation: online-status-glow 2.4s ease-in-out infinite;
    }

    .online-status .dot {
        animation: pulse-green 2s ease-out infinite;
    }
}

@keyframes online-status-glow {
    0%, 100% { box-shadow: 0 2px 7px rgba(var(--online-glow), 0.14); }
    50%      { box-shadow: 0 4px 15px rgba(var(--online-glow), 0.36); }
}

@keyframes btn-soft-pulse {
    0%, 100% {
        box-shadow: 0 5px 15px rgba(42,171,238,0.30), 0 0 0 0 rgba(42,171,238,0.22);
        transform: scale(1);
    }
    50% {
        box-shadow: 0 9px 28px rgba(42,171,238,0.54), 0 0 0 9px rgba(42,171,238,0);
        transform: scale(1.04);
    }
}

.btn {
    width: 100%; font-weight: 700; font-size: 16px; padding: 22px;
    border-radius: 50px; border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    text-transform: uppercase; text-decoration: none; color: #ffffff !important;
}

.icon-svg { width: 23px; height: 23px; fill: #ffffff; flex-shrink: 0; }

.btn-priva {
    background: linear-gradient(135deg, var(--privacy-grad-start), var(--privacy-grad-end));
    box-shadow: 0 5px 15px rgba(42,171,238,0.3);
    animation: btn-soft-pulse 2.5s ease-in-out infinite;
    transition: transform 0.2s;
    margin-top: 8px;
}

.btn-priva:hover { transform: scale(1.02); }

.secure-badge {
    display: flex; align-items: center; justify-content: center; gap: 5px;
    margin-top: auto; padding-top: 24px; font-size: 12px; font-weight: 500; color: var(--secure-text);
}

.lock-icon { width: 12px; height: 12px; flex-shrink: 0; }

.theme-toggle-wrap {
    position: absolute; top: 30px; right: 30px;
    width: 38px; height: 38px;
}

.theme-toggle {
    position: relative;
    width: 38px; height: 38px; border-radius: 50%;
    background: var(--badge-bg); border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.3s ease, transform 0.2s ease;
}

/* ── Tela de carregamento ao abrir o Priva ── */
.card {
    transition: opacity 0.4s ease, transform 0.4s ease, filter 0.4s ease;
}

.card.card-hidden {
    opacity: 0;
    transform: scale(0.94);
    filter: blur(4px);
    pointer-events: none;
}

.redirect-screen {
    position: fixed;
    inset: 0;
    z-index: 10000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 20px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.45s ease;
}

.redirect-screen.open {
    opacity: 1;
    pointer-events: all;
}

.redirect-text {
    font-size: 15px;
    font-weight: 700;
    color: var(--privacy-text);
    letter-spacing: 0.2px;
    opacity: 0;
    transform: translateY(12px);
    transition: opacity 0.45s ease 0.15s, transform 0.45s cubic-bezier(0.22, 1, 0.36, 1) 0.15s;
}

.redirect-screen.open .redirect-text {
    opacity: 1;
    transform: translateY(0);
    animation: redirect-text-pulse 1.6s ease-in-out 0.6s infinite;
}

@keyframes redirect-text-pulse {
    0%, 100% { opacity: 1; }
    50%      { opacity: 0.55; }
}

.redirect-progress-track {
    width: 100%;
    max-width: 240px;
    height: 6px;
    border-radius: 50px;
    background: var(--badge-bg);
    overflow: hidden;
    opacity: 0;
    transform: translateY(12px) scaleX(0.85);
    transition: opacity 0.45s ease 0.28s, transform 0.5s cubic-bezier(0.22, 1, 0.36, 1) 0.28s;
}

.redirect-screen.open .redirect-progress-track {
    opacity: 1;
    transform: translateY(0) scaleX(1);
}

.redirect-progress-fill {
    height: 100%;
    width: 0%;
    border-radius: 50px;
    position: relative;
    background: linear-gradient(135deg, var(--privacy-grad-start), var(--privacy-grad-end));
    box-shadow: 0 0 10px rgba(42,171,238,0.55);
    overflow: hidden;
}

.redirect-progress-fill::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.55), transparent);
    transform: translateX(-100%);
    animation: redirect-shimmer 1.1s ease-in-out infinite;
}

@keyframes redirect-shimmer {
    0%   { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
}

.theme-toggle:hover { transform: scale(1.08); }
.theme-toggle svg { width: 18px; height: 18px; }
.theme-toggle .icon-sun  { display: none; }
.theme-toggle .icon-moon { display: block; }
body.dark-mode .theme-toggle .icon-sun  { display: block; }
body.dark-mode .theme-toggle .icon-moon { display: none; }


/* Confirmação por gesto; não substitui CAPTCHA validado no servidor. */

/* Enquanto a verificação estiver ativa:
   - desfoca o conteúdo atrás do modal
   - impede scroll/movimento da página */
html.verification-active,
body.verification-active {
    overflow: hidden !important;
    overscroll-behavior: none !important;
}

body.verification-active {
    touch-action: none;
}

body.verification-active .card,
body.verification-active .avatar-lightbox,
body.verification-active .redirect-screen {
    filter: blur(7px);
    transform: scale(0.985);
    pointer-events: none;
    user-select: none;
    -webkit-user-select: none;
    transition: filter .22s ease, transform .22s ease;
}

/* O próprio modal continua nítido e interativo */
body.verification-active .human-dialog {
    filter: none !important;
    transform: none;
    pointer-events: auto;
    touch-action: auto;
}

.human-dialog { width:calc(100% - 36px); max-width:340px; max-height:calc(100dvh - 36px); padding:26px 22px 22px; overflow:auto; border:1px solid rgba(128,148,164,.15); border-radius:24px; background:var(--card-bg); color:var(--privacy-text); text-align:center; box-shadow:0 24px 80px rgba(12,32,48,.18); }
.human-dialog::backdrop { background:rgba(15,27,38,.32); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); }
.human-dialog[open] { animation:verify-enter .22s ease-out; }
.verify-icon { width:42px; height:42px; display:block; margin:0 auto 14px; color:var(--privacy-accent); }
.human-dialog h2 { font-size:19px; line-height:1.3; font-weight:800; letter-spacing:-.5px; margin:0 0 9px; }
.verify-description { font-size:12px; line-height:1.65; color:var(--subtitle-text); margin:0 0 21px; }
.verify-track { position:relative; height:60px; width:100%; border-radius:18px; background:rgba(42,171,238,.07); border:1px solid rgba(42,171,238,.15); }
.verify-fill { position:absolute; inset:0 auto 0 0; width:0; border-radius:17px; background:rgba(42,171,238,.13); pointer-events:none; }
.verify-label { position:absolute; inset:0 12px 0 60px; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:600; color:var(--subtitle-text); pointer-events:none; }
.verify-thumb { position:absolute; top:5px; left:5px; width:48px; height:48px; display:grid; place-items:center; padding:0; border:0; border-radius:13px; background:linear-gradient(135deg,var(--privacy-grad-start),var(--privacy-grad-end)); color:white; box-shadow:0 3px 9px rgba(34,158,217,.22); cursor:grab; touch-action:none; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; }
.verify-thumb:focus-visible { outline:3px solid var(--privacy-accent); outline-offset:3px; }
.verify-thumb svg { display:block; width:23px; height:23px; overflow:visible; pointer-events:none; transform-box:fill-box; transform-origin:center; }
.verify-track.dragging .verify-thumb { cursor:grabbing; }
.human-dialog[open] .verify-track:not(.dragging):not(.done) .verify-thumb svg { animation:verify-right-pulse 1.25s ease-in-out infinite; }
.verify-track.done .verify-label { opacity:0 !important; }
.verify-status { font-size:11px; color:var(--privacy-accent); line-height:1.5; min-height:17px; margin:13px 0 0; }
@keyframes verify-enter { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
@keyframes verify-right-pulse {
    0%, 100% { transform: translateX(0) scale(1); opacity: 1; }
    40%      { transform: translateX(7px) scale(1.10); opacity: .72; }
    65%      { transform: translateX(0) scale(1); opacity: 1; }
}
@media(prefers-reduced-motion:reduce) {
    .human-dialog[open] { animation:none; }

    /* Exceção: mantém o pulso da seta para a direita mesmo com redução de movimento. */
    .human-dialog[open] .verify-track:not(.dragging):not(.done) .verify-thumb svg {
        animation: verify-right-pulse 1.25s ease-in-out infinite !important;
    }
}

</style>

<script>if (localStorage.getItem('theme') === 'dark') { document.body.classList.add('dark-mode'); }</script>

    <div class="avatar-ring" id="avatarRing">
        <img src="elianeperfil.jpg" onerror="this.onerror=null;this.src='https://raw.githubusercontent.com/vkalves/meu-segredinho/main/eliane/elianeperfil.jpg';" class="avatar" id="avatarImg1" alt="Eliane Fen" draggable="false" oncontextmenu="return false;">
        <img src="elianeperfil2.jpg" onerror="this.onerror=null;this.src='https://raw.githubusercontent.com/vkalves/meu-segredinho/main/eliane/elianeperfil2.jpg';" class="avatar avatar-secondary" id="avatarImg2" alt="Eliane Fen" draggable="false" oncontextmenu="return false;">
        <svg class="story-ring-svg" viewBox="0 0 136 136" xmlns="http://www.w3.org/2000/svg">
            <defs>
    <mask id="storyRingReveal" maskUnits="userSpaceOnUse"

<script>
// Confirmação visual por gesto; não constitui proteção antirrobô no servidor.
(function() {
    const btn = document.getElementById('privaBtn');
    const dialog = document.getElementById('humanDialog');
    const track = document.getElementById('verifyTrack');
    const thumb = document.getElementById('verifyThumb');
    const fill = document.getElementById('verifyFill');
    const label = document.getElementById('verifyLabel');
    const status = document.getElementById('verifyStatus');
    const glyph = document.getElementById('verifyGlyph');
    let value = 0, pointer = null, startX = 0, startValue = 0, complete = false, timer = 0;
    const distance = () => Math.max(1, track.clientWidth - thumb.offsetWidth - 10);
    function paint(next) {
        value = Math.max(0, Math.min(100, next));
        const px = distance() * value / 100;
        thumb.style.transform = 'translateX(' + px + 'px)';
        fill.style.width = (value ? px + 53 : 0) + 'px';
        label.style.opacity = String(1 - value / 100);
        thumb.setAttribute('aria-valuenow', String(Math.round(value)));
        thumb.setAttribute('aria-valuetext', Math.round(value) + '% concluído');
    }
    function reset() {
        clearTimeout(timer); complete = false; pointer = null;
        track.classList.remove('dragging', 'done');
        thumb.removeAttribute('aria-disabled');
        glyph.setAttribute('d', 'm9 5 7 7-7 7');
        status.textContent = ''; paint(0);
    }
    function finish() {
        if (complete || !dialog.open || document.hidden) return;
        complete = true; pointer = null; paint(100);
        track.classList.remove('dragging'); track.classList.add('done');
        thumb.setAttribute('aria-disabled', 'true');
        glyph.setAttribute('d', 'm5 12 4 4L19 6');
        status.textContent = 'Pronto! Abrindo Priva…';
        timer = setTimeout(function() {
            if (dialog.open && !document.hidden) window.location.assign(btn.href);
        }, 350);
    }
    function lockVerificationPage() {
        document.documentElement.classList.add('verification-active');
        document.body.classList.add('verification-active');
    }

    function unlockVerificationPage() {
        document.documentElement.classList.remove('verification-active');
        document.body.classList.remove('verification-active');
    }

    btn.addEventListener('click', function(e) {
        e.preventDefault(); if (dialog.open) return;
        lockVerificationPage();
        dialog.showModal(); reset(); thumb.focus();
    });
    thumb.addEventListener('pointerdown', function(e) {
        if (complete || pointer !== null || !e.isPrimary || e.button !== 0) return;
        e.preventDefault(); thumb.focus();
        pointer = e.pointerId; startX = e.clientX; startValue = value;
        thumb.setPointerCapture(e.pointerId); track.classList.add('dragging');
    });
    thumb.addEventListener('pointermove', function(e) {
        if (pointer !== e.pointerId || complete) return;
        e.preventDefault(); paint(startValue + (e.clientX - startX) / distance() * 100);
    });
    thumb.addEventListener('pointerup', function(e) {
        if (pointer !== e.pointerId) return;
        if (value >= 98) finish(); else reset();
    });
    ['pointercancel', 'lostpointercapture'].forEach(function(type) {
        thumb.addEventListener(type, function(e) { if (pointer === e.pointerId) reset(); });
    });
    thumb.addEventListener('keydown', function(e) {
        if (complete || pointer !== null) return;
        if (!['ArrowRight', 'ArrowLeft', 'Home', 'End'].includes(e.key)) return;
        e.preventDefault();
        paint(e.key === 'Home' ? 0 : e.key === 'End' ? 100 : value + (e.key === 'ArrowRight' ? 10 : -10));
        if (value === 100) finish();
    });
    thumb.addEventListener('blur', function() { if (!complete) reset(); });
    dialog.addEventListener('click', function(e) {
        if (e.target !== dialog) return;
        const r = dialog.getBoundingClientRect();
        if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) dialog.close();
    });
    dialog.addEventListener('close', function() {
        unlockVerificationPage();
        reset();
        btn.focus();
    });

    dialog.addEventListener('cancel', function() {
        unlockVerificationPage();
        reset();
    });

    window.addEventListener('blur', reset);
    window.addEventListener('resize', reset);
    document.addEventListener('visibilitychange', function() { if (document.hidden) reset(); });

    window.addEventListener('pagehide', function() {
        unlockVerificationPage();
        reset();
    });

    window.addEventListener('pageshow', function() {
        unlockVerificationPage();
        reset();
        if (dialog.open) dialog.close();
    });
})();

    if (!verified) return;

    setTimeout(function() {

// ── Animação do anel segmentado — exatamente 2 execuções ──
(function() {
    var arc       = document.getElementById('ringArc');
    var solid     = document.getElementById('ringSolid');
    var reveal    = document.getElementById('ringReveal');
    var circ      = 402.1;
    var duration  = 430;
    var close     = 340;
    var pause     = 130;
    var cycles    = 1;
    var cycle     = 0;
    var start     = null;
    var timer     = null;
    var stopped   = false;

    function easeInOut(t) {
        return t < 0.5
            ? 4 * t * t * t
            : 1 - Math.pow(-2 * t + 2, 3) / 2;
    }

    /*
     * Easing suave para o crossfade de opacidade entre o anel
     * segmentado e o anel sólido.
     */
    function easeOutQuart(t) {
        return 1 - Math.pow(1 - t, 4);
    }

    function setReveal(value) {
        reveal.style.strokeDashoffset = value;
    }

    function setOpacity(el, value) {
        el.style.opacity = value;
    }

    function startCycle() {
        setOpacity(arc, 1);
        setOpacity(solid, 0);
        setReveal(circ);
        arc.style.strokeDasharray = '6 5';
        start = null;
        requestAnimationFrame(step);
    }

    function step(ts) {
        if (stopped) return;
        if (start === null) start = ts;

        var progress = Math.min((ts - start) / duration, 1);
        var eased = easeInOut(progress);

        setReveal(circ * (1 - eased));

        if (progress < 1) {
            requestAnimationFrame(step);
            return;
        }

        /*
         * O último segmento chega ao ponto inicial sem trocar de desenho.
         * Só depois começa a fusão visual entre as duas versões do anel.
         */
        setReveal(0);

        var closeStart = null;

        function closeFrame(now) {
            if (stopped) return;
            if (closeStart === null) closeStart = now;

            var p = Math.min((now - closeStart) / close, 1);
            var easedClose = easeOutQuart(p);

            /*
             * Crossfade: o círculo segmentado perde presença enquanto o
             * círculo inteiro surge exatamente na mesma posição.
             */
            setOpacity(arc, 1 - easedClose);
            setOpacity(solid, easedClose);

            /*
             * Enquanto fecha, o espaço entre os pedaços do anel vai
             * diminuindo até virar uma linha contínua — os pedaços vão
             * se juntando em vez de ficarem soltos.
             */
            arc.style.strokeDasharray = '6 ' + (5 * (1 - easedClose)).toFixed(2);

            if (p < 1) {
                requestAnimationFrame(closeFrame);
                return;
            }

            setOpacity(arc, 0);
            setOpacity(solid, 1);

            cycle++;

            if (cycle >= cycles) {
                stopped = true;

                /* Assim que o anel fecha, ele pisca duas vezes. */
                solid.classList.add('ring-blink');
                solid.addEventListener('animationend', function handler() {
                    solid.classList.remove('ring-blink');
                    solid.removeEventListener('animationend', handler);
                });

                return;
            }

            /*
             * Mantém o círculo inteiro por um instante antes de iniciar
             * discretamente o próximo percurso.
             */
            timer = setTimeout(function() {
                if (!stopped) startCycle();
            }, pause);
        }

        requestAnimationFrame(closeFrame);
    }

    setReveal(circ);
    setOpacity(arc, 1);
    setOpacity(solid, 0);

    setTimeout(function() {
        startCycle();
    }, 300);

    window.addEventListener('pageshow', function(e) {
        if (e.persisted && !stopped) {
            clearTimeout(timer);
            stopped = true;
            setReveal(0);
            setOpacity(arc, 0);
            setOpacity(solid, 1);
        }
    });
})();

// ── Troca automática de foto ──
(function() {
    var img1 = document.getElementById('avatarImg1');
    var img2 = document.getElementById('avatarImg2');
    if (!img1 || !img2) return;

    // Após 2s, troca da primeira foto para a segunda (crossfade)
    setTimeout(function() {
        img1.style.opacity = 0;
        img2.style.opacity = 1;
    }, 2000);
})();

// ── Lightbox ──
(function() {
    var ring     = document.getElementById('avatarRing');
    var lightbox = document.getElementById('avatarLightbox');
    var autoClose;

    function openLightbox() {
        lightbox.classList.add('open');
        clearTimeout(autoClose);
        autoClose = setTimeout(closeLightbox, 2000);
    }

    function closeLightbox() {
        lightbox.classList.remove('open');
        clearTimeout(autoClose);
    }

    ring.addEventListener('click', openLightbox);

    // Bloqueia o menu nativo de salvar imagem (toque longo / botão direito)
    ring.addEventListener('contextmenu', function(e) {
        e.preventDefault();
    });

    // Toque e segure no avatar do cabeçalho: abre a animação de expansão
    var holdTimer = null;
    var HOLD_MS = 280;

    ring.addEventListener('touchstart', function() {
        clearTimeout(holdTimer);
        holdTimer = setTimeout(openLightbox, HOLD_MS);
    }, { passive: true });

    ring.addEventListener('touchend', function() {
        clearTimeout(holdTimer);
    });

    ring.addEventListener('touchcancel', function() {
        clearTimeout(holdTimer);
    });

    lightbox.addEventListener('click', function(e) {
        if (e.target === lightbox) closeLightbox();
    });
})();
</script>
