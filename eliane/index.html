<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#07050d">
  <meta name="description" content="Eliane preparou um presente especial para você.">
  <title>Um presente da Eliane</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2307050d'/%3E%3Cpath d='M12 27h40v27H12z' fill='%23f7b947'/%3E%3Cpath d='M9 20h46v12H9zM28 20h8v34h-8z' fill='%23ffe7a0'/%3E%3Cpath d='M32 20C17 18 18 7 24 7c6 0 8 8 8 13Zm0 0C47 18 46 7 40 7c-6 0-8 8-8 13Z' fill='none' stroke='%23f7b947' stroke-width='5' stroke-linejoin='round'/%3E%3C/svg%3E">
  <style>
    :root {
      --bg: #07050d;
      --gold: #ffd76a;
      --gold-2: #f5a83d;
      --cream: #fff1c7;
      --muted: rgba(255,255,255,.62);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { width: 100%; min-height: 100%; }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
      color: #fff;
      font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, Arial, sans-serif;
      background:
        radial-gradient(circle at 50% 28%, rgba(69, 42, 102, .72) 0, rgba(19, 13, 33, .9) 34%, transparent 63%),
        linear-gradient(160deg, #0c0815 0%, var(--bg) 60%, #030307 100%);
      -webkit-tap-highlight-color: transparent;
    }

    .page {
      position: relative;
      isolation: isolate;
      display: grid;
      place-items: center;
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      padding: max(24px, env(safe-area-inset-top)) 22px max(24px, env(safe-area-inset-bottom));
    }

    .page::before {
      content: "";
      position: fixed;
      z-index: -2;
      width: min(120vw, 620px);
      aspect-ratio: 1;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 199, 78, .2), rgba(255, 199, 78, 0) 68%);
      animation: orb-pulse 3.8s ease-in-out infinite;
      pointer-events: none;
    }

    .page::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      opacity: .24;
      background-image: radial-gradient(rgba(255, 241, 199, .65) .7px, transparent .7px);
      background-size: 28px 28px;
      mask-image: linear-gradient(to bottom, transparent, #000 20%, #000 80%, transparent);
      pointer-events: none;
    }

    .content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: min(100%, 430px);
      text-align: center;
    }

    .eyebrow {
      margin-bottom: 14px;
      color: var(--cream);
      font-size: clamp(11px, 3vw, 13px);
      font-weight: 700;
      letter-spacing: .24em;
      text-transform: uppercase;
      text-shadow: 0 0 18px rgba(255, 215, 106, .45);
      animation: enter .75s ease-out both;
    }

    .pointer {
      margin-bottom: -5px;
      font-size: clamp(42px, 12vw, 58px);
      line-height: 1;
      filter: drop-shadow(0 0 18px rgba(255, 199, 78, .65));
      animation: point 1.45s ease-in-out infinite, enter .85s .08s ease-out both;
    }

    .gift-button {
      position: relative;
      display: grid;
      place-items: center;
      width: clamp(190px, 55vw, 230px);
      aspect-ratio: 1;
      margin: 4px 0 14px;
      border: 0;
      border-radius: 50%;
      color: inherit;
      background: transparent;
      cursor: pointer;
      touch-action: manipulation;
    }

    .gift-button::before,
    .gift-button::after {
      content: "";
      position: absolute;
      inset: 2%;
      border: 2px solid rgba(255, 215, 106, .34);
      border-radius: 50%;
      animation: ring 2.25s ease-out infinite;
    }

    .gift-button::after { animation-delay: 1.125s; }

    .gift-button:focus-visible {
      outline: 3px solid var(--cream);
      outline-offset: 6px;
    }

    .gift {
      font-size: clamp(102px, 32vw, 138px);
      line-height: 1;
      filter: drop-shadow(0 0 28px rgba(255, 190, 70, .62));
      animation: gift-float 2.4s ease-in-out infinite, gift-glow 2s ease-in-out infinite;
      user-select: none;
    }

    h1 {
      max-width: 390px;
      font-size: clamp(25px, 7.4vw, 34px);
      line-height: 1.08;
      letter-spacing: -.035em;
      text-wrap: balance;
      animation: enter .9s .16s ease-out both;
    }

    .subtitle {
      max-width: 340px;
      margin-top: 10px;
      color: var(--muted);
      font-size: clamp(13px, 3.8vw, 15px);
      line-height: 1.5;
      text-wrap: balance;
      animation: enter .9s .24s ease-out both;
    }

    .cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      min-width: 218px;
      min-height: 54px;
      margin-top: 25px;
      padding: 15px 30px;
      border: 0;
      border-radius: 999px;
      color: #261800;
      background: linear-gradient(135deg, var(--gold), var(--gold-2));
      box-shadow: 0 9px 28px rgba(246, 169, 59, .44), inset 0 1px rgba(255,255,255,.65);
      font: inherit;
      font-size: 15px;
      font-weight: 850;
      letter-spacing: .045em;
      text-transform: uppercase;
      cursor: pointer;
      touch-action: manipulation;
      animation: cta-pulse 1.9s ease-in-out infinite, enter 1s .32s ease-out both;
    }

    .cta svg { width: 20px; height: 20px; fill: currentColor; }
    .cta:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
    .cta:active, .gift-button:active .gift { transform: scale(.95); }

    .particle {
      position: fixed;
      z-index: 0;
      bottom: -18px;
      border-radius: 50%;
      background: rgba(255, 218, 137, .56);
      box-shadow: 0 0 8px rgba(255, 201, 82, .45);
      pointer-events: none;
      animation: rise linear infinite;
    }

    .flash {
      position: fixed;
      inset: 0;
      z-index: 10;
      opacity: 0;
      background: #fff9e9;
      pointer-events: none;
    }

    .flash.active { animation: flash .38s ease-out forwards; }

    .page.leaving .content {
      opacity: 0;
      transform: scale(.94);
      filter: blur(4px);
      transition: opacity .28s ease, transform .28s ease, filter .28s ease;
    }

    @keyframes enter { from { opacity: 0; transform: translateY(10px); } }
    @keyframes orb-pulse { 50% { opacity: .72; transform: scale(1.16); } }
    @keyframes point { 50% { transform: translateY(14px); } }
    @keyframes ring { from { transform: scale(.62); opacity: .9; } to { transform: scale(1.32); opacity: 0; } }
    @keyframes gift-float { 0%, 100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-12px) scale(1.04) rotate(2deg); } }
    @keyframes gift-glow { 50% { filter: drop-shadow(0 0 44px rgba(255, 215, 106, .9)); } }
    @keyframes cta-pulse { 50% { transform: scale(1.035); box-shadow: 0 11px 38px rgba(246, 169, 59, .7), inset 0 1px rgba(255,255,255,.7); } }
    @keyframes rise { 0% { transform: translate3d(0, 0, 0); opacity: 0; } 12% { opacity: 1; } 88% { opacity: .7; } 100% { transform: translate3d(var(--drift), -115vh, 0); opacity: 0; } }
    @keyframes flash { from { opacity: .9; } to { opacity: 0; } }

    @media (max-height: 650px) {
      .content { transform: scale(.88); }
      .gift-button { margin-block: -5px 4px; }
      .cta { margin-top: 18px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
      .particle { display: none; }
    }
  </style>
</head>
<body>
  <main class="page" id="page">
    <section class="content" aria-labelledby="title">
      <p class="eyebrow">Um presente da Eliane</p>
      <div class="pointer" aria-hidden="true">👇</div>

      <button class="gift-button" id="giftButton" type="button" aria-label="Abrir o presente da Eliane">
        <span class="gift" aria-hidden="true">🎁</span>
      </button>

      <h1 id="title">Preparei algo especial para você</h1>
      <p class="subtitle">Toque no presente para abrir e falar comigo no Telegram.</p>

      <button class="cta" id="ctaButton" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.67 3.72 2.94 10.55c-1.21.49-1.2 1.16-.22 1.46l4.55 1.42 10.53-6.64c.5-.3.95-.14.58.19l-8.54 7.7-.31 4.7c.46 0 .66-.21.92-.46l2.21-2.15 4.6 3.4c.85.46 1.46.22 1.67-.79l3.02-14.23c.3-1.24-.48-1.8-1.28-1.43Z"/></svg>
        Abrir presente
      </button>
    </section>
    <div class="flash" id="flash" aria-hidden="true"></div>
  </main>

  <script>
    (function () {
      'use strict';

      var TELEGRAM_URL = 'https://t.me/elianefenn';
      var page = document.getElementById('page');
      var flash = document.getElementById('flash');
      var giftButton = document.getElementById('giftButton');
      var ctaButton = document.getElementById('ctaButton');
      var leaving = false;

      if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        for (var i = 0; i < 20; i += 1) {
          var particle = document.createElement('span');
          var size = 2 + Math.random() * 4;
          particle.className = 'particle';
          particle.style.width = size + 'px';
          particle.style.height = size + 'px';
          particle.style.left = Math.random() * 100 + 'vw';
          particle.style.setProperty('--drift', (-25 + Math.random() * 50) + 'px');
          particle.style.animationDuration = (6 + Math.random() * 6) + 's';
          particle.style.animationDelay = (-Math.random() * 10) + 's';
          page.appendChild(particle);
        }
      }

      function openTelegram() {
        if (leaving) return;
        leaving = true;
        page.classList.add('leaving');
        flash.classList.add('active');
        window.setTimeout(function () {
          window.location.href = TELEGRAM_URL;
        }, 240);
      }

      giftButton.addEventListener('click', openTelegram);
      ctaButton.addEventListener('click', openTelegram);

      window.addEventListener('pageshow', function () {
        leaving = false;
        page.classList.remove('leaving');
        flash.classList.remove('active');
      });
    }());
  </script>
</body>
</html>
