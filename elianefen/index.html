@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@1,500;1,600&display=swap');

:root {
    --privacy-grad-start: #2AABEE;
    --privacy-grad-end:   #229ED9;
    --privacy-accent:     #2AABEE;
    --privacy-text:       #343434;
    --bg-grad-start: #eaf6fd;
    --bg-grad-end:   #fcfcfc;
    --card-bg:       #ffffff;
    --badge-bg:      #e8edf1;
    --badge-text:    #4a4a4a;
    --subtitle-text: #555555;
    --secure-text:   #888888;
    --icon-stroke:   #777777;
}

body.dark-mode {
    --bg-grad-start: #0f1115;
    --bg-grad-end:   #15181e;
    --card-bg:       #1b1e24;
    --badge-bg:      #2a2e36;
    --badge-text:    #e4e6eb;
    --privacy-text:  #f2f2f2;
    --subtitle-text: #b7bcc4;
    --secure-text:   #8a8f98;
    --icon-stroke:   #a2a7b0;
}

html, body { margin: 0; padding: 0; width: 100%; }
* { box-sizing: border-box; font-family: 'Montserrat', sans-serif; }

body {
    min-height: 100vh;
    background: linear-gradient(135deg, var(--bg-grad-start), var(--bg-grad-end));
    display: flex; align-items: center; justify-content: center; padding: 20px;
    transition: background 0.3s ease;
}

.card {
    background: var(--card-bg); width: 100%; max-width: 380px; min-height: 480px;
    padding: 35px 25px; border-radius: 25px; text-align: center;
    box-shadow: 0 20px 40px rgba(0,0,0,0.1);
    display: flex; flex-direction: column; align-items: center;
    transition: background 0.3s ease;
    position: relative;
}

/* ── Avatar Ring ── */
.avatar-ring {
    width: 126px; height: 126px; border-radius: 50%;
    margin-bottom: 15px;
    position: relative;
    cursor: pointer;
    background: transparent;
    padding: 0;
}

.avatar {
    width: 116px; height: 116px; border-radius: 50%;
    object-fit: cover; display: block;
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    border: 2px solid #fff;
    transition: transform 0.3s ease, opacity 0.6s ease;
    /* Bloqueia o menu nativo de "salvar imagem" no toque longo */
    pointer-events: none;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    -webkit-user-drag: none;
    -khtml-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
    /* previne qualquer salto de layout durante o crossfade, mesmo com pinch-zoom */
    will-change: opacity;
    backface-visibility: hidden;
}

.avatar-ring:active .avatar {
    transform: translate(-50%, -50%) scale(0.96);
}

/* Crossfade entre as duas fotos do cabeçalho: ambas ocupam o mesmo espaço (position absolute),
   então a troca de opacidade não move nem redimensiona nada — sem risco de "bug" no zoom. */
.avatar-photo {
    opacity: 0;
}

.avatar-photo.active {
    opacity: 1;
}

.story-ring-svg {
    position: absolute;
    inset: 0;
    width: 126px;
    height: 126px;
    pointer-events: none;
    overflow: visible;
}

.story-ring-track {
    fill: none;
    stroke: transparent;
    stroke-width: 3.5;
}

/* Anel azul segmentado. A máscara revela os segmentos sem mover o anel. */
.story-ring-arc {
    fill: none;
    stroke: var(--privacy-grad-start);
    stroke-width: 3.7;
    stroke-linecap: round;
    stroke-dasharray: 6 5;
    stroke-dashoffset: 0;
    transform-origin: 63px 63px;
    transform: rotate(-90deg);
    opacity: 1;
}

.story-ring-solid {
    fill: none;
    stroke: var(--privacy-grad-start);
    stroke-width: 3.7;
    stroke-linecap: round;
    stroke-dasharray: none;
    stroke-dashoffset: 0;
    transform-origin: 63px 63px;
    transform: rotate(-90deg);
    opacity: 0;
}

@keyframes ringBlink {
    0%, 100% { opacity: 1; }
    50%      { opacity: 0.15; }
}

.story-ring-solid.ring-blink {
    animation: ringBlink 0.25s ease-in-out 2;
}

.story-ring-reveal {
    fill: none;
    stroke: #fff;
    stroke-width: 7;
    stroke-linecap: round;
    stroke-dasharray: 370.7 370.7;
    stroke-dashoffset: 370.7;
    transform-origin: 63px 63px;
    transform: rotate(-90deg);
}

/* Sem pulso, brilho ou escala ao completar. */
/* ── Lightbox ── */
.avatar-lightbox {
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.4s ease;
    background: rgba(0,0,0,0);
    backdrop-filter: blur(0px);
    -webkit-backdrop-filter: blur(0px);
    transition: opacity 0.4s ease, background 0.4s ease, backdrop-filter 0.4s ease;
}

.avatar-lightbox.open {
    opacity: 1;
    pointer-events: all;
    background: rgba(0,0,0,0.75);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
}

.lightbox-inner {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    transform: scale(0.7) translateY(30px);
    opacity: 0;
    transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.35s ease;
}

.avatar-lightbox.open .lightbox-inner {
    transform: scale(1) translateY(0);
    opacity: 1;
}

.avatar-lightbox-img {
    width: 82vw;
    max-width: 310px;
    height: 82vw;
    max-height: 310px;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid rgba(255,255,255,0.9);
    box-shadow:
        0 0 0 1px rgba(42,171,238,0.3),
        0 20px 60px rgba(0,0,0,0.6),
        0 0 80px rgba(42,171,238,0.2);
    display: block;
    pointer-events: none;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    -webkit-user-drag: none;
    user-select: none;
}

/* Anel azul ao redor da foto expandida */
.lightbox-ring {
    position: absolute;
    inset: -8px;
    border-radius: 50%;
    border: 2.5px solid rgba(42,171,238,0.6);
    transform: scale(0.85);
    opacity: 0;
    transition: transform 0.5s cubic-bezier(0.34, 1.2, 0.64, 1) 0.1s, opacity 0.4s ease 0.1s;
}

.avatar-lightbox.open .lightbox-ring {
    transform: scale(1);
    opacity: 1;
}

/* Shimmer externo que aparece ao abrir */
.lightbox-shimmer {
    position: absolute;
    inset: -20px;
    border-radius: 50%;
    border: 1px solid rgba(42,171,238,0.25);
    transform: scale(0.8);
    opacity: 0;
    transition: transform 0.7s cubic-bezier(0.2, 1, 0.4, 1) 0.15s, opacity 0.5s ease 0.15s;
}

.avatar-lightbox.open .lightbox-shimmer {
    transform: scale(1);
    opacity: 1;
}


/* ── Resto do layout ── */
.badge {
    font-family: 'Montserrat', sans-serif;
    font-style: normal;
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: var(--badge-text);
    background: var(--badge-bg);
    padding: 5px 14px;
    border-radius: 50px;
    margin-bottom: 10px;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    transition: background 0.3s ease, color 0.3s ease;
}

.badge-name { display: inline-flex; align-items: center; gap: 5px; text-transform: none; }

.verified-icon {
    width: 16px;
    height: 16px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transform-origin: center;
}

.verified-icon svg {
    width: 16px;
    height: 16px;
    display: block;
    overflow: visible;
}

.verified-icon.pulse {
    animation: verified-pulse 850ms cubic-bezier(0.22, 1, 0.36, 1) 1;
}

@keyframes verified-pulse {
    0%   { transform: scale(1); }
    35%  { transform: scale(1.18); }
    58%  { transform: scale(0.96); }
    78%  { transform: scale(1.08); }
    100% { transform: scale(1); }

.title { font-size: 22px; font-weight: 800; color: var(--privacy-text); margin-bottom: 6px; }
.subtitle { font-size: 13px; color: var(--subtitle-text); font-weight: 500; line-height: 1.4; margin-bottom: 15px; }

.online-status {

body.dark-mode .online-status {

@keyframes pulse-green {

@keyframes btn-soft-pulse {

    50%       { box-shadow: 0 8px 28px rgba(42,171,238,0.65), 0 0 0 6px rgba(42,171,238,0.18); transform: scale(1.04); }
}

.btn {
    width: 100%; font-weight: 700; font-size: 15px; padding: 20px;
    border-radius: 50px; border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    text-transform: uppercase; text-decoration: none; color: #ffffff !important;
}

.icon-svg { width: 22px; height: 22px; fill: #ffffff; flex-shrink: 0; }

.btn-telegram {

.btn-telegram:hover { transform: scale(1.02); }

.secure-badge {

}

.lock-icon { width: 12px; height: 12px; flex-shrink: 0; }

.theme-toggle-wrap {
    position: absolute; top: 30px; right: 30px;
    width: 38px; height: 38px;
}

.theme-toggle {
    position: relative;

.theme-toggle:hover { transform: scale(1.08); }
.theme-toggle svg { width: 18px; height: 18px; }
.theme-toggle .icon-sun  { display: none; }
.theme-toggle .icon-moon { display: block; }
body.dark-mode .theme-toggle .icon-sun  { display: block; }
body.dark-mode .theme-toggle .icon-moon { display: none; }

/* Balão de aviso centralizado embaixo do botão, sempre alinhado independente da largura do texto */
.theme-hint {
    position: absolute;
    top: 47px;
    left: 50%;
    padding: 5px 9px;
    border-radius: 8px;
    white-space: nowrap;

    /* contraste discreto com o site claro */
    background: rgba(32, 35, 40, 0.92);
    color: rgba(255, 255, 255, 0.88);
    border: 1px solid rgba(255, 255, 255, 0.06);
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.10);

    font-size: 9px;
    font-weight: 500;
    letter-spacing: 0.1px;

    opacity: 0;
    transform: translateX(-50%) translateY(-3px);
    pointer-events: none;
    transition: opacity 0.28s ease, transform 0.28s ease;
    z-index: 2;

    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
}

.theme-hint::before {
    content: '';
    position: absolute;
    top: -4px;
    left: 50%;
    width: 7px;
    height: 7px;
    background: rgba(32, 35, 40, 0.92);
    transform: translateX(-50%) rotate(45deg);
}

.theme-hint.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
}

/* no modo escuro, o aviso usa o contraste inverso */
body.dark-mode .theme-hint {
    background: rgba(238, 240, 243, 0.94);
    color: #373b42;
    border-color: rgba(0, 0, 0, 0.04);
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.14);
}

body.dark-mode .theme-hint::before {
    background: rgba(238, 240, 243, 0.94);
}

</style>
</head>

<script>
// ── Tema ──
(function() {
    var toggle = document.getElementById('themeToggle');

    function syncThemeButtonLabel() {
        var isDark = document.body.classList.contains('dark-mode');

        toggle.setAttribute(
            'aria-label',
            isDark ? 'Ativar modo claro' : 'Ativar modo escuro'
        );
    }

    syncThemeButtonLabel();

    toggle.addEventListener('click', function() {
        document.body.classList.toggle('dark-mode');

        localStorage.setItem(
            'theme',
            document.body.classList.contains('dark-mode') ? 'dark' : 'light'
        );

        // Atualiza apenas o botão imediatamente.
        // O texto da notificação é atualizado somente na próxima exibição.
        syncThemeButtonLabel();
    });
})();

// ── Dica do botão de tema ──
(function() {
    var hint = document.getElementById('themeHint');
    var toggle = document.getElementById('themeToggle');
    if (!hint || !toggle) return;

    var timesShown = 0;
    var maxShows = 2;
    var themeClicked = false;
    var hideTimer = null;
    var secondShowTimer = null;

    function getNextThemeLabel() {
        return document.body.classList.contains('dark-mode')
            ? 'modo claro'
            : 'modo escuro';
    }

    function showHint() {
        // Depois que o botão foi clicado, nenhuma nova notificação é enviada.
        if (themeClicked || timesShown >= maxShows) return;

        // O texto só é atualizado no instante em que uma nova notificação aparece.
        hint.textContent = getNextThemeLabel();
        timesShown++;

        hint.classList.add('show');

        clearTimeout(hideTimer);
        hideTimer = setTimeout(function() {
            hint.classList.remove('show');

            // Se a primeira terminou e o usuário ainda não clicou no tema,
            // agenda a segunda para 3 segundos depois.
            if (!themeClicked && timesShown === 1) {
                clearTimeout(secondShowTimer);
                secondShowTimer = setTimeout(showHint, 3000);
            }
        }, 2000);
    }

    // Primeira notificação ao carregar.
    setTimeout(showHint, 500);

    toggle.addEventListener('click', function() {
        themeClicked = true;

        // Cancela somente futuras notificações.
        // Se a primeira já estiver visível, ela termina normalmente,
        // sem trocar o texto antes de desaparecer.
        clearTimeout(secondShowTimer);
    });
})();

// ── Pulso suave do verificado, 3s após a inicialização ──
(function() {
    var verified = document.getElementById('verifiedIcon');
    if (!verified) return;

    setTimeout(function() {
        verified.classList.add('pulse');

        verified.addEventListener('animationend', function handler() {
            verified.classList.remove('pulse');
            verified.removeEventListener('animationend', handler);
        });
    }, 3000);
})();

// ── Animação do anel segmentado — exatamente 2 execuções ──
(function() {
    var arc       = document.getElementById('ringArc');
    var solid     = document.getElementById('ringSolid');
    var reveal    = document.getElementById('ringReveal');
    var circ      = 370.7;
    var duration  = 430;
    var close     = 340;
    var pause     = 130;
    var cycles    = 1;
    var cycle     = 0;
    var start     = null;
    var timer     = null;
    var stopped   = false;

    function easeInOut(t) {
        return t < 0.5
            ? 4 * t * t * t
            : 1 - Math.pow(-2 * t + 2, 3) / 2;
    }

    /*
     * Easing suave para o crossfade de opacidade entre o anel
     * segmentado e o anel sólido.
     */
    function easeOutQuart(t) {
        return 1 - Math.pow(1 - t, 4);
    }

    function setReveal(value) {
        reveal.style.strokeDashoffset = value;
    }

    function setOpacity(el, value) {
        el.style.opacity = value;
    }

    function startCycle() {
        setOpacity(arc, 1);
        setOpacity(solid, 0);
        setReveal(circ);
        arc.style.strokeDasharray = '6 5';
        start = null;
        requestAnimationFrame(step);
    }

    function step(ts) {
        if (stopped) return;
        if (start === null) start = ts;

        var progress = Math.min((ts - start) / duration, 1);
        var eased = easeInOut(progress);

        setReveal(circ * (1 - eased));

        if (progress < 1) {
            requestAnimationFrame(step);
            return;
        }

        /*
         * O último segmento chega ao ponto inicial sem trocar de desenho.
         * Só depois começa a fusão visual entre as duas versões do anel.
         */
        setReveal(0);

        var closeStart = null;

        function closeFrame(now) {
            if (stopped) return;
            if (closeStart === null) closeStart = now;

            var p = Math.min((now - closeStart) / close, 1);
            var easedClose = easeOutQuart(p);

            /*
             * Crossfade: o círculo segmentado perde presença enquanto o
             * círculo inteiro surge exatamente na mesma posição.
             */
            setOpacity(arc, 1 - easedClose);
            setOpacity(solid, easedClose);

            /*
             * Enquanto fecha, o espaço entre os pedaços do anel vai
             * diminuindo até virar uma linha contínua — os pedaços vão
             * se juntando em vez de ficarem soltos.
             */
            arc.style.strokeDasharray = '6 ' + (5 * (1 - easedClose)).toFixed(2);

            if (p < 1) {
                requestAnimationFrame(closeFrame);
                return;
            }

            setOpacity(arc, 0);
            setOpacity(solid, 1);

            cycle++;

            if (cycle >= cycles) {
                stopped = true;

                /* Assim que o anel fecha, ele pisca duas vezes. */
                solid.classList.add('ring-blink');
                solid.addEventListener('animationend', function handler() {
                    solid.classList.remove('ring-blink');
                    solid.removeEventListener('animationend', handler);
                });

                return;
            }

            /*
             * Mantém o círculo inteiro por um instante antes de iniciar
             * discretamente o próximo percurso.
             */
            timer = setTimeout(function() {
                if (!stopped) startCycle();
            }, pause);
        }

        requestAnimationFrame(closeFrame);
    }

    setReveal(circ);
    setOpacity(arc, 1);
    setOpacity(solid, 0);

    setTimeout(function() {
        startCycle();
    }, 300);

    window.addEventListener('pageshow', function(e) {
        if (e.persisted && !stopped) {
            clearTimeout(timer);
            stopped = true;
            setReveal(0);
            setOpacity(arc, 0);
            setOpacity(solid, 1);
        }
    });
})();

// ── Lightbox ──
(function() {
    var ring     = document.getElementById('avatarRing');
    var lightbox = document.getElementById('avatarLightbox');
    var autoClose;

    function openLightbox() {
        lightbox.classList.add('open');
        clearTimeout(autoClose);
        autoClose = setTimeout(closeLightbox, 2000);
    }

    function closeLightbox() {
        lightbox.classList.remove('open');
        clearTimeout(autoClose);
    }

    ring.addEventListener('click', openLightbox);

    // Bloqueia o menu nativo de salvar imagem (toque longo / botão direito)
    ring.addEventListener('contextmenu', function(e) {
        e.preventDefault();
    });

    // Toque e segure no avatar do cabeçalho: abre a animação de expansão
    var holdTimer = null;
    var HOLD_MS = 280;

    ring.addEventListener('touchstart', function() {
        clearTimeout(holdTimer);
        holdTimer = setTimeout(openLightbox, HOLD_MS);
    }, { passive: true });

    ring.addEventListener('touchend', function() {
        clearTimeout(holdTimer);
    });

    ring.addEventListener('touchcancel', function() {
        clearTimeout(holdTimer);
    });

    lightbox.addEventListener('click', function(e) {
        if (e.target === lightbox) closeLightbox();
    });
})();
</script>
